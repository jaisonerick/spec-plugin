<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plaud — Ativar transcrição</title>
<style>
  :root{
    --bg:#f7f7f8; --card:#fff; --fg:#1a1a1e; --muted:#6b6b76; --line:#e6e6ea;
    --accent:#3b5bdb; --accent-fg:#fff; --warn:#8a6d0b; --warn-bg:#fff6d6; --chip:#eef0f5;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111114; --card:#1b1b20; --fg:#eaeaf0; --muted:#9a9aa6; --line:#2a2a32;
      --accent:#5c7cfa; --accent-fg:#0b0b0e; --warn:#e6c34d; --warn-bg:#332a08; --chip:#26262e; }
  }
  :root[data-theme=dark]{ --bg:#111114; --card:#1b1b20; --fg:#eaeaf0; --muted:#9a9aa6; --line:#2a2a32;
      --accent:#5c7cfa; --accent-fg:#0b0b0e; --warn:#e6c34d; --warn-bg:#332a08; --chip:#26262e; }
  :root[data-theme=light]{ --bg:#f7f7f8; --card:#fff; --fg:#1a1a1e; --muted:#6b6b76; --line:#e6e6ea;
      --accent:#3b5bdb; --accent-fg:#fff; --warn:#8a6d0b; --warn-bg:#fff6d6; --chip:#eef0f5; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding:24px}
  .wrap{max-width:920px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 18px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
  button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer}
  button.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
  button:active{transform:translateY(1px)}
  .stat{background:var(--chip);border-radius:8px;padding:6px 12px;color:var(--muted);font-size:13px}
  .stat b{color:var(--fg)}
  section{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 16px;overflow:hidden}
  .shead{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .shead h2{font-size:15px;margin:0}
  .shead .c{color:var(--muted);font-size:13px}
  table{width:100%;border-collapse:collapse}
  td,th{padding:9px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
  tr:last-child td{border-bottom:none}
  td.date{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
  td.dur{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;text-align:right}
  td.name{color:var(--fg)}
  a.open{display:inline-block;text-decoration:none;background:var(--accent);color:var(--accent-fg);padding:5px 12px;border-radius:7px;font-size:13px;white-space:nowrap}
  a.open:hover{opacity:.9}
  .warn{background:var(--warn-bg);color:var(--warn);padding:10px 16px;font-size:13px;border-bottom:1px solid var(--line)}
  tr.done td{opacity:.4}
  .chk{width:34px;text-align:center}
  input[type=checkbox]{width:17px;height:17px;cursor:pointer}
  footer{color:var(--muted);font-size:12px;margin-top:8px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Plaud — gravações sem transcrição</h1>
  <p class="sub">Abra cada link e ative a transcrição no web.plaud.ai. O check marca as já ativadas (fica salvo neste navegador).</p>
  <div class="bar">
    <button class="primary" id="copyAll">Copiar todos os links (significativas)</button>
    <button id="copyShort">Copiar links das curtas</button>
    <button id="reset">Limpar checks</button>
    <span class="stat"><b id="statSig">0</b> significativas &middot; <b id="statShort">0</b> curtas &middot; <b id="statDone">0</b> ativadas</span>
  </div>
  <div id="app"></div>
  <footer>Gerado por Claude Code &middot; estado dos checks salvo em localStorage (chave por recording id)</footer>
</div>
<script>
const DATA = __PAYLOAD__;
const LS='plaud_activated_v1';
let done = JSON.parse(localStorage.getItem(LS)||'{}');
function save(){localStorage.setItem(LS, JSON.stringify(done));}
function monthLabel(ym){
  const [y,m]=ym.split('-');
  const names=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return names[+m-1]+'/'+y;
}
function groupByMonth(items){
  const g={};
  items.forEach(it=>{const k=it.day.slice(0,7);(g[k]=g[k]||[]).push(it);});
  return Object.keys(g).sort().reverse().map(k=>[k,g[k]]);
}
function rowHtml(it){
  const cls = done[it.id]?'done':'';
  return `<tr class="${cls}" data-id="${it.id}">
    <td class="chk"><input type="checkbox" ${done[it.id]?'checked':''}></td>
    <td class="date">${it.date}</td>
    <td class="dur">${it.min} min</td>
    <td class="name">${it.name||'<span style=opacity:.5>(sem nome)</span>'}</td>
    <td><a class="open" href="${it.url}" target="_blank" rel="noopener">Abrir &rarr;</a></td>
  </tr>`;
}
function sectionHtml(title, items, warn){
  const months = groupByMonth(items);
  let body='';
  months.forEach(([ym,rows])=>{
    body += `<tr><th colspan=5 style="background:var(--chip)">${monthLabel(ym)} &middot; ${rows.length}</th></tr>`;
    body += rows.map(rowHtml).join('');
  });
  return `<section>
    <div class="shead"><h2>${title}</h2><span class="c">${items.length} gravações</span></div>
    ${warn?`<div class="warn">${warn}</div>`:''}
    <table><thead><tr><th class=chk></th><th>Data</th><th>Duração</th><th>Nome</th><th></th></tr></thead>
    <tbody>${body}</tbody></table>
  </section>`;
}
function render(){
  const sig = DATA.filter(d=>!d.short);
  const short = DATA.filter(d=>d.short);
  document.getElementById('app').innerHTML =
    sectionHtml('Significativas (&ge; 1 min)', sig, null) +
    sectionHtml('Curtas (&lt; 1 min) — provavelmente acidentais', short,
      'Duração menor que 1 minuto. Provavelmente gravações acidentais; ative só se reconhecer alguma.');
  document.getElementById('statSig').textContent = sig.length;
  document.getElementById('statShort').textContent = short.length;
  updateDone();
}
function updateDone(){
  document.getElementById('statDone').textContent = Object.values(done).filter(Boolean).length;
}
document.addEventListener('change', e=>{
  if(e.target.matches('input[type=checkbox]')){
    const id=e.target.closest('tr').dataset.id;
    if(e.target.checked) done[id]=true; else delete done[id];
    e.target.closest('tr').classList.toggle('done', e.target.checked);
    save(); updateDone();
  }
});
document.getElementById('copyAll').onclick=()=>{
  const t=DATA.filter(d=>!d.short).map(d=>d.url).join('\n');
  navigator.clipboard.writeText(t); alert(DATA.filter(d=>!d.short).length+' links copiados.');
};
document.getElementById('copyShort').onclick=()=>{
  const t=DATA.filter(d=>d.short).map(d=>d.url).join('\n');
  navigator.clipboard.writeText(t); alert(DATA.filter(d=>d.short).length+' links copiados.');
};
document.getElementById('reset').onclick=()=>{
  if(confirm('Limpar todos os checks?')){done={};save();render();}
};
render();
</script>
</body>
</html>
